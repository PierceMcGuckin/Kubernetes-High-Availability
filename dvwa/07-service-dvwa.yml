apiVersion: v1
kind: Service
metadata:
  name: dvwa
  namespace: dvwa
spec:
  type: LoadBalancer          # MetalLB assigns an IP from your pool
  selector:
    app: dvwa
  # DVWA keeps login sessions and CSRF tokens in per-pod PHP session files.
  # Pin each client to one pod so logins don't bounce between replicas.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - port: 80
      targetPort: 80
